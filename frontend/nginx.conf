limit_req_zone $binary_remote_addr zone=authentication:10m rate=10r/m;
log_format claimpilot escape=json '{"method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';
server {
 access_log /dev/stdout claimpilot;
 listen 80;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 location ~ ^/api/v1/auth/(login|register)/?$ {
   limit_req zone=authentication burst=35 nodelay;
   limit_req_status 429;
   proxy_pass http://backend:8000;
 }
 location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 180s; }
 location /docs { proxy_pass http://backend:8000; }
 location /openapi.json { proxy_pass http://backend:8000; }
 location /health { proxy_pass http://backend:8000; }
 location / {
   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
   add_header X-Content-Type-Options nosniff always;
   add_header Referrer-Policy no-referrer always;
   try_files $uri /index.html;
 }
}

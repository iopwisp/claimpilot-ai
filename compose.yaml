x-api: &api
  build: .
  environment:
    DATABASE_PASSWORD_FILE: /run/bootstrap/password
    REDIS_URL: redis://redis:6379/0
    STATE_DIR: /srv/state
    AI_PROVIDER: ${AI_PROVIDER:-local}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - files:/srv/state
    - bootstrap:/run/bootstrap:ro
services:
  init:
    image: postgres:16-alpine
    volumes: [bootstrap:/run/bootstrap]
    entrypoint: [sh, -ec, "test -s /run/bootstrap/password || head -c 48 /dev/urandom | base64 > /run/bootstrap/password"]
  postgres:
    image: pgvector/pgvector:pg16
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      POSTGRES_USER: pilot
      POSTGRES_DB: claims
      POSTGRES_PASSWORD_FILE: /run/bootstrap/password
    volumes: [pgdata:/var/lib/postgresql/data, bootstrap:/run/bootstrap:ro]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pilot -d claims"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [jobs:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    <<: *api
    command: [sh, -ec, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    <<: *api
    command: [celery, -A, app.jobs:queue, worker, --loglevel=WARNING, --concurrency=2]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  pgdata:
  files:
  jobs:
  bootstrap:
